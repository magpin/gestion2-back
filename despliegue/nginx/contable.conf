# Nginx de contable: PROD y QA, cada uno con su dominio y su dominio de archivos.
#
# Va en /etc/nginx/sites-available/contable, con symlink en sites-enabled. Es
# un archivo aparte del de Sine: si hay que quitar contable, se borra el symlink
# y Sine ni se entera.
#
# Dominios: registros A a 2.24.103.48 en Hostinger, creados el 24 sep 2026.
# Para activarlo:
#   nginx -t && systemctl reload nginx      (reload, nunca restart: Sine vive acá)
#   certbot --nginx -d contable.computintasdigital.com \
#     -d archivos.contable.computintasdigital.com \
#     -d qa.contable.computintasdigital.com \
#     -d archivos-qa.contable.computintasdigital.com
# Certbot agrega el `listen 443 ssl` y la redirección de http a https.


# ═══ PROD ══════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name contable.computintasdigital.com;

    client_max_body_size 20M;            # PDF de facturas

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;          # María puede tardar leyendo un PDF
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Las URLs firmadas llevan el host dentro de la firma: si Nginx cambia el
# `Host`, MinIO responde SignatureDoesNotMatch. Por eso $http_host tal cual.
server {
    listen 80;
    server_name archivos.contable.computintasdigital.com;

    client_max_body_size 20M;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# ═══ QA ════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name qa.contable.computintasdigital.com;

    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # QA no tiene que aparecer en buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name archivos-qa.contable.computintasdigital.com;

    client_max_body_size 20M;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:9200;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
