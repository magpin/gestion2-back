# Los cuatro servicios del proyecto, para desarrollo.
#
# Vive en `backend/` porque es el único de los tres repos que está versionado y
# es el dueño de la base y del bucket. Levanta también el frontend, que está al
# lado: `../frontend` existe si los dos repos se clonaron en la misma carpeta,
# que es como trabaja el proyecto.
#
# La forma es la que producción va a necesitar —cada servicio por separado,
# configuración por entorno, volúmenes con nombre— para que desplegar sea
# cambiar variables y no rehacer esto. Lo que falta para producción está
# anotado en `docs/planes/ajustes-16-sep.md`, paso 7.
#
#   docker compose up -d        levanta todo
#   docker compose logs -f api  mira el backend
#   docker compose down         lo baja (los datos quedan en los volúmenes)

name: gestion

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:-db_gestion}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    # La API arranca recién cuando Postgres contesta, no cuando el contenedor
    # existe: sin esto, la primera migración falla una de cada dos veces.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}
    ports:
      - "9000:9000"   # la API S3, que es la que usa el backend
      - "9001:9001"   # la consola web, para mirar qué hay adentro
    volumes:
      - datos_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Crea el bucket una vez y se apaga. Existe para que levantar el proyecto por
  # primera vez no requiera entrar a la consola a crear el bucket a mano.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET:-gestion};
      echo 'bucket listo';
      "

  api:
    build:
      context: .
      target: desarrollo
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-db_gestion}
      PORT: 3001
      NODE_ENV: development
      API_PREFIX: api/v1
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CLAVE_CIFRADO: ${CLAVE_CIFRADO}
      # `minio` y no `localhost`: adentro de la red de compose cada servicio se
      # llama por su nombre.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${MINIO_BUCKET:-gestion}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Lo que el navegador puede alcanzar. Adentro es `minio`, afuera es
      # `localhost`: una URL firmada se abre desde el navegador, no desde la API.
      S3_ENDPOINT_PUBLICO: ${S3_ENDPOINT_PUBLICO:-http://localhost:9000}
    ports:
      - "3001:3001"
    volumes:
      - ./src:/app/src
      - ./db:/app/db
    command: yarn start:dev

  web:
    build:
      context: ../frontend
      target: desarrollo
    depends_on:
      - api
    environment:
      # La ve el navegador, así que apunta a `localhost` y no a `api`.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
    command: yarn dev

volumes:
  datos_db:
  datos_minio:
